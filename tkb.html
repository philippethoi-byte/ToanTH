<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Kế Hoạch Thông Minh Của Bé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f8fafc;
        }
        .checkbox-custom:checked + label {
            text-decoration: line-through;
            color: #94a3b8;
            opacity: 0.7;
        }
        .task-item {
            border-left-width: 6px;
            transition: all 0.2s;
        }
        .task-personal { border-left-color: #3b82f6; background-color: #eff6ff; }
        .task-study { border-left-color: #22c55e; background-color: #f0fdf4; }
        .task-family { border-left-color: #ec4899; background-color: #fdf2f8; }
        .task-extra { border-left-color: #f59e0b; background-color: #fffbeb; border-style: dashed; }
        
        .day-btn.active {
            background-color: #f59e0b;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        @media print {
            .no-print { display: none !important; }
            body { background-color: white; padding: 0; }
            .main-container { box-shadow: none; border: 1px solid #ddd; border-radius: 0; }
        }
    </style>
</head>
<body class="p-2 md:p-6">

    <div class="max-w-6xl mx-auto bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border-4 border-yellow-400 main-container">
        <!-- Header -->
        <div class="bg-gradient-to-r from-yellow-300 via-orange-400 to-red-400 p-6 text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-white drop-shadow-lg uppercase tracking-wider">🌈 Lịch Trình Thông Minh Của Bé 🌈</h1>
            
            <div class="mt-6 flex flex-wrap justify-center gap-2 no-print">
                <button onclick="setDay(2)" class="day-btn bg-white/30 text-white px-4 py-2 rounded-full font-bold hover:bg-white/50 transition-all" id="btn-2">Thứ 2</button>
                <button onclick="setDay(3)" class="day-btn bg-white/30 text-white px-4 py-2 rounded-full font-bold hover:bg-white/50 transition-all" id="btn-3">Thứ 3</button>
                <button onclick="setDay(4)" class="day-btn bg-white/30 text-white px-4 py-2 rounded-full font-bold hover:bg-white/50 transition-all" id="btn-4">Thứ 4</button>
                <button onclick="setDay(5)" class="day-btn bg-white/30 text-white px-4 py-2 rounded-full font-bold hover:bg-white/50 transition-all" id="btn-5">Thứ 5</button>
                <button onclick="setDay(6)" class="day-btn bg-white/30 text-white px-4 py-2 rounded-full font-bold hover:bg-white/50 transition-all" id="btn-6">Thứ 6</button>
                <button onclick="setDay(7)" class="day-btn bg-white/30 text-white px-4 py-2 rounded-full font-bold hover:bg-white/50 transition-all" id="btn-7">Thứ 7</button>
                <button onclick="setDay(8)" class="day-btn bg-white/30 text-white px-4 py-2 rounded-full font-bold hover:bg-white/50 transition-all" id="btn-8">Chủ Nhật</button>
            </div>
            
            <div class="mt-4 text-white font-bold text-xl drop-shadow-sm" id="current-day-display">Hôm nay là: Thứ ...</div>
        </div>

        <div class="p-4 md:p-8 grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- BUỔI SÁNG -->
            <div class="space-y-4">
                <div class="bg-yellow-100 p-4 rounded-2xl flex items-center justify-center mb-4 shadow-sm border-b-4 border-yellow-300">
                    <span class="text-2xl mr-2">🌅</span>
                    <h2 class="text-xl font-black text-yellow-700 uppercase">Buổi Sáng</h2>
                </div>
                <div class="space-y-3" id="morning-tasks"></div>
            </div>

            <!-- BUỔI TRƯA & CHIỀU -->
            <div class="space-y-4">
                <div class="bg-orange-100 p-4 rounded-2xl flex items-center justify-center mb-4 shadow-sm border-b-4 border-orange-300">
                    <span class="text-2xl mr-2">☀️</span>
                    <h2 class="text-xl font-black text-orange-700 uppercase">Trưa & Chiều</h2>
                </div>
                <div class="space-y-3" id="afternoon-tasks"></div>
            </div>

            <!-- BUỔI TỐI -->
            <div class="space-y-4">
                <div class="bg-indigo-100 p-4 rounded-2xl flex items-center justify-center mb-4 shadow-sm border-b-4 border-indigo-300">
                    <span class="text-2xl mr-2">🌙</span>
                    <h2 class="text-xl font-black text-indigo-700 uppercase">Buổi Tối</h2>
                </div>
                <div class="space-y-3" id="evening-tasks"></div>
            </div>
        </div>

        <!-- Phần Sticker / Khen thưởng -->
        <div class="bg-gray-50 p-6 border-t-2 border-dashed border-gray-200">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
                <div class="lg:col-span-3 text-center lg:text-left">
                    <h3 class="text-xl font-black text-orange-600 mb-2 underline decoration-yellow-400">🎁 GÓC KHEN THƯỞNG</h3>
                    <p class="text-gray-600 text-sm font-bold leading-tight">Mỗi ngày làm tốt thưởng 5 sao!</p>
                </div>

                <div class="lg:col-span-4 flex justify-center gap-3">
                    <div class="bg-white p-2 rounded-2xl shadow-sm border-2 border-yellow-300 flex flex-col items-center min-w-[75px]">
                        <span class="text-2xl">⭐</span>
                        <span class="text-[10px] font-bold">Thưởng</span>
                        <span class="text-[10px] text-gray-500">5 sao/ngày</span>
                    </div>
                    <div class="bg-white p-2 rounded-2xl shadow-sm border-2 border-yellow-300 flex flex-col items-center min-w-[75px]">
                        <span class="text-2xl">🍦</span>
                        <span class="text-[10px] font-bold">Kem ngon</span>
                        <span class="text-[10px] text-gray-500">25 sao</span>
                    </div>
                    <div class="bg-white p-2 rounded-2xl shadow-sm border-2 border-yellow-300 flex flex-col items-center min-w-[75px]">
                        <span class="text-2xl">🎡</span>
                        <span class="text-[10px] font-bold">Đi chơi</span>
                        <span class="text-[10px] text-gray-500">300 sao</span>
                    </div>
                </div>

                <div class="lg:col-span-2 flex flex-col items-center justify-center bg-orange-100 p-3 rounded-2xl border-2 border-orange-300">
                    <span class="text-xs font-black text-orange-700 uppercase mb-1">Tích lũy đến nay</span>
                    <div class="flex items-center gap-2">
                        <span class="text-2xl">✨</span>
                        <input type="number" id="total-stars" oninput="saveRewardData()" class="w-20 bg-white border-2 border-orange-400 rounded-lg text-center font-black text-xl text-orange-600 focus:outline-none" value="0">
                    </div>
                </div>

                <div class="lg:col-span-3 w-full">
                    <textarea id="parent-note" oninput="saveRewardData()" class="w-full p-3 rounded-xl border-2 border-orange-200 text-sm focus:ring-orange-300 focus:border-orange-400 outline-none" rows="2" placeholder="Lời nhắn của ba mẹ..."></textarea>
                </div>
            </div>
        </div>

        <div class="bg-white p-4 no-print flex flex-wrap justify-center gap-4 border-t border-gray-100">
            <button onclick="window.print()" class="bg-orange-500 text-white font-black py-3 px-8 rounded-full shadow-lg hover:bg-orange-600 transition-all">🖨️ IN BẢNG KẾ HOẠCH</button>
            <button onclick="clearAllData()" class="bg-gray-400 text-white font-black py-3 px-8 rounded-full shadow-lg hover:bg-gray-500 transition-all text-sm">🗑️ XÓA HẾT DỮ LIỆU</button>
        </div>
    </div>

    <script>
        let currentDay = 2;
        const scheduleExtra = {
            2: [{ time: "19:30 - 21:00", subject: "🎓 Học Tiếng Anh", type: "study-extra" }],
            3: [
                { time: "17:00 - 18:30", subject: "🎓 Học Cờ Vua", type: "afternoon-extra" },
                { time: "20:00 - 21:30", subject: "🎓 Học Toán", type: "study-extra" }
            ],
            4: [{ time: "20:00 - 21:30", subject: "🎓 Học Toán", type: "study-extra" }],
            5: [{ time: "19:00 - 20:30", subject: "🎓 Học Vẽ", type: "study-extra" }],
            6: [{ time: "19:30 - 21:00", subject: "🎓 Học Tiếng Anh", type: "study-extra" }],
            7: [],
            8: [{ time: "16:30 - 18:00", subject: "🎓 Học Cờ Vua", type: "afternoon-extra" }]
        };

        // --- HÀM LƯU TRỮ ---
        function saveDayProgress() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            const progress = {};
            checkboxes.forEach(cb => { progress[cb.id] = cb.checked; });
            localStorage.setItem(`day_${currentDay}_progress`, JSON.stringify(progress));
        }

        function loadDayProgress(dayNum) {
            const saved = localStorage.getItem(`day_${dayNum}_progress`);
            if (saved) {
                const progress = JSON.parse(saved);
                Object.keys(progress).forEach(id => {
                    const cb = document.getElementById(id);
                    if (cb) cb.checked = progress[id];
                });
            }
        }

        function saveRewardData() {
            localStorage.setItem('total_stars', document.getElementById('total-stars').value);
            localStorage.setItem('parent_note', document.getElementById('parent-note').value);
        }

        function loadRewardData() {
            document.getElementById('total-stars').value = localStorage.getItem('total_stars') || 0;
            document.getElementById('parent-note').value = localStorage.getItem('parent_note') || "";
        }

        function clearAllData() {
            if(confirm("Xóa tất cả tích chọn và sao tích lũy?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // --- HÀM GIAO DIỆN ---
        function setDay(dayNum) {
            saveDayProgress();
            currentDay = dayNum;
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById(`btn-${dayNum}`);
            if (btn) btn.classList.add('active');
            
            const dayNames = {2: "Thứ Hai", 3: "Thứ Ba", 4: "Thứ Tư", 5: "Thứ Năm", 6: "Thứ Sáu", 7: "Thứ Bảy", 8: "Chủ Nhật"};
            document.getElementById('current-day-display').innerText = "Hôm nay là: " + dayNames[dayNum];

            renderTasks(dayNum);
            loadDayProgress(dayNum);
        }

        function getExtraHTML(dayNum, type) {
            let html = '';
            const activities = scheduleExtra[dayNum].filter(a => a.type === type);
            activities.forEach((act, i) => {
                html += `
                    <div class="task-item task-extra p-3 rounded-xl shadow-sm border-2 border-orange-200 my-2">
                        <span class="text-xs font-bold text-orange-600">${act.time}</span>
                        <div class="flex items-center mt-1">
                            <input type="checkbox" id="ext-${dayNum}-${type}-${i}" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-orange-400">
                            <label for="ext-${dayNum}-${type}-${i}" class="ml-3 font-bold text-orange-800 cursor-pointer">${act.subject}</label>
                        </div>
                    </div>
                `;
            });
            return html;
        }

        function renderTasks(dayNum) {
            const morningContainer = document.getElementById('morning-tasks');
            const afternoonContainer = document.getElementById('afternoon-tasks');
            const eveningContainer = document.getElementById('evening-tasks');

            const commonLateNight = `
                <div class="task-item task-personal p-3 rounded-xl shadow-sm mt-4">
                    <span class="text-xs font-bold text-blue-600">21:30</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="e-clean-final" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-blue-300">
                        <label for="e-clean-final" class="ml-3 font-bold text-gray-700 cursor-pointer">Vệ sinh cá nhân</label>
                    </div>
                </div>
                <div class="task-item task-personal p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-blue-600">22:00</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="e-sleep-final" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-blue-300">
                        <label for="e-sleep-final" class="ml-3 font-bold text-gray-700 uppercase cursor-pointer">Đi ngủ đúng giờ</label>
                    </div>
                </div>
            `;

            if (dayNum === 7) {
                morningContainer.innerHTML = `<div class="task-item task-study p-3 rounded-xl shadow-sm border-2 border-green-200"><span class="text-xs font-bold text-green-600">Buổi Sáng</span><div class="flex items-center mt-1"><input type="checkbox" id="sat-m" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-green-400"><label for="sat-m" class="ml-3 font-bold text-gray-700 cursor-pointer">Học Toán</label></div></div>`;
                afternoonContainer.innerHTML = `<div class="text-center text-gray-400 italic text-sm py-4">Bé tự do vui chơi! 🎮</div>`;
                eveningContainer.innerHTML = `<div class="task-item task-study p-3 rounded-xl shadow-sm border-2 border-green-200"><span class="text-xs font-bold text-green-600">Buổi Tối</span><div class="flex items-center mt-1"><input type="checkbox" id="sat-e" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-green-400"><label for="sat-e" class="ml-3 font-bold text-gray-700 cursor-pointer">Học Tiếng Anh</label></div></div>` + commonLateNight;
                return;
            }

            if (dayNum === 8) {
                morningContainer.innerHTML = `<div class="task-item task-study p-3 rounded-xl shadow-sm border-2 border-green-200"><span class="text-xs font-bold text-green-600">Buổi Sáng</span><div class="flex items-center mt-1"><input type="checkbox" id="sun-m" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-green-400"><label for="sun-m" class="ml-3 font-bold text-gray-700 cursor-pointer">Học Toán</label></div></div>`;
                afternoonContainer.innerHTML = getExtraHTML(8, 'afternoon-extra') || `<div class="text-center text-gray-400 italic text-sm py-4">Giờ nghỉ ngơi! 🌳</div>`;
                eveningContainer.innerHTML = `
                    <div class="task-item task-personal p-3 rounded-xl shadow-sm mt-4">
                        <span class="text-xs font-bold text-blue-600">21:30</span>
                        <div class="flex items-center mt-1">
                            <input type="checkbox" id="sun-clean" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-blue-300">
                            <label for="sun-clean" class="ml-3 font-bold text-gray-700 cursor-pointer">Vệ sinh cá nhân</label>
                        </div>
                    </div>
                    <div class="task-item task-study p-3 rounded-xl shadow-sm">
                        <span class="text-xs font-bold text-green-600">21:45</span>
                        <div class="flex items-center mt-1">
                            <input type="checkbox" id="sun-prep" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-green-300">
                            <label for="sun-prep" class="ml-3 font-bold text-gray-700 cursor-pointer">Chuẩn bị tập vở mai đi học</label>
                        </div>
                    </div>
                    <div class="task-item task-personal p-3 rounded-xl shadow-sm">
                        <span class="text-xs font-bold text-blue-600">22:00</span>
                        <div class="flex items-center mt-1">
                            <input type="checkbox" id="sun-sleep" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-blue-300">
                            <label for="sun-sleep" class="ml-3 font-bold text-gray-700 uppercase cursor-pointer">Đi ngủ đúng giờ</label>
                        </div>
                    </div>
                `;
                return;
            }

            // T2-T6 CHI TIẾT
            morningContainer.innerHTML = `
                <div class="task-item task-personal p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-blue-600">06:00 - 06:10</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="m-vshn" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-blue-300">
                        <label for="m-vshn" class="ml-3 font-bold text-gray-700 cursor-pointer">Vệ sinh cá nhân</label>
                    </div>
                </div>
                <div class="task-item task-family p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-pink-600">06:10 - 06:15</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="m-gap" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-pink-300">
                        <label for="m-gap" class="ml-3 font-bold text-gray-700 cursor-pointer">Gấp chăn màn</label>
                    </div>
                </div>
                <div class="task-item task-personal p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-blue-600">06:15 - 07:00</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="m-ans" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-blue-300">
                        <label for="m-ans" class="ml-3 font-bold text-gray-700 cursor-pointer">Ăn sáng</label>
                    </div>
                </div>
                <div class="task-item task-study p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-green-600">07:15 - 11:00</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="m-school" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-green-300">
                        <label for="m-school" class="ml-3 font-bold text-gray-700 cursor-pointer">Học tập ở trường</label>
                    </div>
                </div>
            `;

            let afternoonHTML = `
                <div class="task-item task-personal p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-blue-600">11:30</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="t-antrua" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-blue-300">
                        <label for="t-antrua" class="ml-3 font-bold text-gray-700 cursor-pointer">Ăn trưa</label>
                    </div>
                </div>
                <div class="task-item task-personal p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-blue-600">12:00</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="t-nghi" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-blue-300">
                        <label for="t-nghi" class="ml-3 font-bold text-gray-700 cursor-pointer">Nghỉ ngơi</label>
                    </div>
                </div>
                <div class="task-item task-study p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-green-600">13:00 - 17:00</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="t-school-pm" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-green-300">
                        <label for="t-school-pm" class="ml-3 font-bold text-gray-700 cursor-pointer">Học tập buổi chiều ở trường</label>
                    </div>
                </div>
            `;
            if ([2, 4, 6].includes(dayNum)) {
                afternoonHTML += `<div class="task-item task-family p-3 rounded-xl shadow-sm"><span class="text-xs font-bold text-pink-600">17:00 - 17:30</span><div class="flex items-center mt-1"><input type="checkbox" id="t-vchoi" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-pink-300"><label for="t-vchoi" class="ml-3 font-bold text-gray-700 cursor-pointer">Vui chơi ở sân trường</label></div></div>`;
            }
            afternoonHTML += getExtraHTML(dayNum, 'afternoon-extra');
            afternoonContainer.innerHTML = afternoonHTML;

            let eveningHTML = `
                <div class="task-item task-personal p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-blue-600">18:00</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="e-tam" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-blue-300">
                        <label for="e-tam" class="ml-3 font-bold text-gray-700 cursor-pointer">Đi tắm</label>
                    </div>
                </div>
                <div class="task-item task-family p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-pink-600">18:15</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="e-phu" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-pink-300">
                        <label for="e-phu" class="ml-3 font-bold text-gray-700 cursor-pointer">Phụ Ba mẹ nấu cơm</label>
                    </div>
                </div>
                <div class="task-item task-family p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-pink-600">18:30 - 19:30</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="e-anto" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-pink-300">
                        <label for="e-anto" class="ml-3 font-bold text-gray-700 cursor-pointer">Ăn tối</label>
                    </div>
                </div>
            `;
            eveningHTML += getExtraHTML(dayNum, 'study-extra');
            eveningHTML += `
                <div class="task-item task-personal p-3 rounded-xl shadow-sm mt-4">
                    <span class="text-xs font-bold text-blue-600">21:30</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="e-vshn-pm" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-blue-300">
                        <label for="e-vshn-pm" class="ml-3 font-bold text-gray-700 cursor-pointer">Vệ sinh cá nhân</label>
                    </div>
                </div>
                <div class="task-item task-study p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-green-600">21:45</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="e-prep-pm" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-green-300">
                        <label for="e-prep-pm" class="ml-3 font-bold text-gray-700 cursor-pointer">Chuẩn bị tập vở mai đi học</label>
                    </div>
                </div>
                <div class="task-item task-personal p-3 rounded-xl shadow-sm">
                    <span class="text-xs font-bold text-blue-600">22:00</span>
                    <div class="flex items-center mt-1">
                        <input type="checkbox" id="e-sleep-pm" onchange="saveDayProgress()" class="checkbox-custom w-5 h-5 rounded-full border-2 border-blue-300">
                        <label for="e-sleep-pm" class="ml-3 font-bold text-gray-700 uppercase cursor-pointer">Đi ngủ đúng giờ</label>
                    </div>
                </div>
            `;
            eveningContainer.innerHTML = eveningHTML;
        }

        window.onload = () => {
            loadRewardData();
            setDay(2);
        };
    </script>
</body>
</html>
